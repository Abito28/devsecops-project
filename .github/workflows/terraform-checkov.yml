name: Terraform Checkov Scan

on:
    pull_request:

permissions: {}

jobs:
  changes:
    name: terraform checkov changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      terraform: ${{ steps.filter.outputs.terraform }}
    steps:
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706   # v4.0.2
        id: filter
        with:
          filters: |
            terraform:
              - 'terraform/**'
              - '.github/workflows/terraform-*.yml'

  checkov:
    name: Terraform Checkov
    needs: changes
    if: needs.changes.outputs.terraform == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Install Checkov
        uses: bridgecrewio/checkov-action@a32f8b5c5c7c958bc38947c65dfe139debaf0607 # v12.3140.0
        with:
          directory: terraform
          framework: terraform
          output_format: cli
